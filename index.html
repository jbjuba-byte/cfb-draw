<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CFB 24-Team Playoff & Pot Draw Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 font-sans">
    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <header class="text-center mb-8">
            <h1 class="text-4xl font-black tracking-wider text-amber-400">CFB 138-Team League Draw</h1>
            <p class="text-slate-400 mt-2">Phil Steele Vegas Power Ratings (Unique 12 Opponent Guarantee)</p>
        </header>

        <!-- Control Area -->
        <div class="flex flex-col sm:flex-row justify-center items-center gap-4 mb-8">
            <button onclick="runDraw()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-8 py-3 rounded-xl shadow-lg transition-all transform hover:scale-105 cursor-pointer">
                Simulate Full League Draw
            </button>
            <div class="w-full sm:w-72">
                <input type="text" id="search-input" onkeyup="filterSchedules()" placeholder="Search team schedule..." class="w-full bg-slate-800 border border-slate-700 text-slate-100 rounded-xl px-4 py-3 focus:outline-none focus:border-amber-400 placeholder-slate-500">
            </div>
        </div>

        <!-- Pots Grid View -->
        <h2 class="text-xl font-bold text-slate-300 mb-4">Pots (Strictly Sequenced 1–138 from Phil Steele List)</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-12" id="pots-container">
            <!-- Pots 1-6 render here dynamically -->
        </div>

        <!-- Output Schedules -->
        <div class="bg-slate-800 rounded-2xl p-6 shadow-xl border border-slate-700">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-emerald-400">Generated 12-Game Schedules</h2>
                <span id="schedule-count" class="text-sm text-slate-400">0 / 138 Teams Generated</span>
            </div>
            
            <div id="schedule-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 max-h-[600px] overflow-y-auto p-2">
                <p class="text-slate-400 italic col-span-full text-center py-8">Click "Simulate Full League Draw" to calculate and display schedules for all 138 teams!</p>
            </div>
        </div>
    </div>

    <script>
        // Transcribed EXACTLY from Phil Steele Vegas Ratings image (1 to 138)
        const philSteeleMaster = [
            // Pot 1 (Ranks 1–23)
            "GEORGIA", "NOTRE DAME", "OHIO ST", "ALABAMA", "TEXAS", "MIAMI (FLA)", "LSU", "INDIANA", "MISSISSIPPI", "OREGON", 
            "OKLAHOMA", "FLORIDA", "MISSOURI", "UTAH", "USC", "TEXAS TECH", "TENNESSEE", "BYU", "MISS ST", "NEBRASKA", 
            "IOWA", "HOUSTON", "KENTUCKY",

            // Pot 2 (Ranks 24–46)
            "WAKE FOREST", "UCLA", "TEXAS A&M", "MICHIGAN", "NORTHWESTERN", "AUBURN", "ARIZONA", "LOUISVILLE", "S CAROLINA", "WISCONSIN", 
            "SMU", "BAYLOR", "OKLAHOMA ST", "BOISE ST", "PENN ST", "KANSAS ST", "TCU", "DUKE", "VIRGINIA TECH", "FLORIDA ST", 
            "PITTSBURGH", "N CAROLINA", "CLEMSON",

            // Pot 3 (Ranks 47–69)
            "VIRGINIA", "MINNESOTA", "NEW MEXICO", "OREGON ST", "ARIZONA ST", "WASHINGTON", "VANDERBILT", "UCF", "ILLINOIS", "CINCINNATI", 
            "NC STATE", "PURDUE", "IOWA ST", "KANSAS", "James Madison", "W VIRGINIA", "GEORGIA TECH", "MEMPHIS", "North Dakota St", "N TEXAS", 
            "ARKANSAS", "UTSA", "COLORADO",

            // Pot 4 (Ranks 70–92)
            "CALIFORNIA", "MICHIGAN ST", "FRESNO ST", "TEXAS ST", "MARYLAND", "UNLV", "SYRACUSE", "LIBERTY", "RUTGERS", "BOSTON COLLEGE", 
            "ARMY", "GEORGIA SOUTHERN", "USF", "FLORIDA ATLANTIC", "NAVY", "GEORGIA ST", "E CAROLINA", "TULSA", "LOUISIANA", "LA TECH", 
            "W MICHIGAN", "TULANE", "CONNECTICUT",

            // Pot 5 (Ranks 93–115)
            "AIR FORCE", "TOLEDO", "TEMPLE", "APPALACHIAN ST", "STANFORD", "SOUTH ALABAMA", "UTAH ST", "TROY", "WASHINGTON ST", "ARKANSAS ST", 
            "FLORIDA INT", "JACKSONVILLE ST", "OLD DOMINION", "OHIO", "COLORADO ST", "MIAMI (OH)", "UAB", "NEVADA", "SAN DIEGO ST", "SAN JOSE ST", 
            "HAWAII", "RICE", "WYOMING",

            // Pot 6 (Ranks 116–138)
            "W KENTUCKY", "Kennesaw St", "N MEXICO ST", "E MICHIGAN", "MARSHALL", "C MICHIGAN", "COASTAL CAROLINA", "MIDDLE TENN", "Delaware", "Sam Houston", 
            "BOWLING GREEN", "BUFFALO", "S MISS", "Missouri St", "MASSACHUSETTS", "KENT", "N ILLINOIS", "BALL ST", "AKRON", "ULM", 
            "UTEP", "CHARLOTTE", "Sacramento St"
        ];

        // Slice master array into 6 pots of 23 teams
        const potsData = [
            { id: 1, name: "Pot 1 (Ranks 1–23)", teams: philSteeleMaster.slice(0, 23) },
            { id: 2, name: "Pot 2 (Ranks 24–46)", teams: philSteeleMaster.slice(23, 46) },
            { id: 3, name: "Pot 3 (Ranks 47–69)", teams: philSteeleMaster.slice(46, 69) },
            { id: 4, name: "Pot 4 (Ranks 70–92)", teams: philSteeleMaster.slice(69, 92) },
            { id: 5, name: "Pot 5 (Ranks 93–115)", teams: philSteeleMaster.slice(92, 115) },
            { id: 6, name: "Pot 6 (Ranks 116–138)", teams: philSteeleMaster.slice(115, 138) }
        ];

        function shuffle(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Generate derangement (no element matches reference array at same index)
        function getDerangement(arr) {
            let shuffled = shuffle(arr);
            while (shuffled.some((val, idx) => val === arr[idx])) {
                shuffled = shuffle(arr);
            }
            return shuffled;
        }

        let currentSchedules = {};

        function displayPots() {
            const container = document.getElementById('pots-container');
            container.innerHTML = potsData.map(pot => `
                <div class="bg-slate-800 rounded-xl p-4 border border-slate-700">
                    <h3 class="font-bold text-amber-400 mb-2 border-b border-slate-700 pb-2">${pot.name}</h3>
                    <div class="text-xs text-slate-300 grid grid-cols-2 gap-1 max-h-36 overflow-y-auto">
                        ${pot.teams.map((t, idx) => `<div class="truncate">• ${(pot.id - 1) * 23 + idx + 1}.${t}</div>`).join('')}
                    </div>
                </div>
            `).join('');
        }

        function runDraw() {
            currentSchedules = {};
            philSteeleMaster.forEach(team => currentSchedules[team] = []);

            // 1. Intra-pot matchups (Same Pot: 1 Home & 1 Away, strictly unique)
            potsData.forEach(pot => {
                const teams = pot.teams;
                const homeDerangement = getDerangement(teams);
                
                teams.forEach((team, idx) => {
                    const homeOpponent = homeDerangement[idx];
                    
                    currentSchedules[team].push({
                        opponent: homeOpponent,
                        location: "Home",
                        pot: pot.id
                    });

                    currentSchedules[homeOpponent].push({
                        opponent: team,
                        location: "Away",
                        pot: pot.id
                    });
                });
            });

            // 2. Inter-pot matchups (Pot X vs Pot Y: Guaranteeing 2 different opponents)
            for (let p1 = 0; p1 < 6; p1++) {
                for (let p2 = p1 + 1; p2 < 6; p2++) {
                    const pot1Teams = potsData[p1].teams;
                    const pot2Teams = potsData[p2].teams;

                    // Matchup A: Pot 1 hosts Pot 2
                    const pot2VisitorsA = shuffle(pot2Teams);

                    // Matchup B: Pot 2 hosts Pot 1 (Visitor list B MUST be a derangement of Visitor list A)
                    const pot2VisitorsB = getDerangement(pot2VisitorsA);

                    pot1Teams.forEach((teamP1, idx) => {
                        const homeOpponent = pot2VisitorsA[idx]; // P1 hosts this P2 team
                        const awayOpponent = pot2VisitorsB[idx]; // P1 travels to this DIFFERENT P2 team

                        // P1's Home game vs P2
                        currentSchedules[teamP1].push({
                            opponent: homeOpponent,
                            location: "Home",
                            pot: p2 + 1
                        });
                        currentSchedules[homeOpponent].push({
                            opponent: teamP1,
                            location: "Away",
                            pot: p1 + 1
                        });

                        // P1's Away game @ P2
                        currentSchedules[teamP1].push({
                            opponent: awayOpponent,
                            location: "Away",
                            pot: p2 + 1
                        });
                        currentSchedules[awayOpponent].push({
                            opponent: teamP1,
                            location: "Home",
                            pot: p1 + 1
                        });
                    });
                }
            }

            renderSchedules();
        }

        function renderSchedules() {
            const grid = document.getElementById('schedule-grid');
            const teams = Object.keys(currentSchedules);
            
            document.getElementById('schedule-count').innerText = `${teams.length} / 138 Teams Generated`;

            grid.innerHTML = teams.map(team => {
                const games = currentSchedules[team];
                
                // Sort games strictly by Pot # (1 to 6) then Home/Away
                games.sort((a, b) => a.pot - b.pot || (a.location === 'Home' ? -1 : 1));

                return `
                    <div class="team-card bg-slate-950 rounded-xl p-4 border border-slate-800" data-team="${team.toLowerCase()}">
                        <div class="flex justify-between items-center border-b border-slate-800 pb-1 mb-2">
                            <h4 class="font-bold text-lg text-amber-400">${team}</h4>
                            <span class="text-xs bg-slate-800 text-emerald-400 px-2 py-0.5 rounded font-mono">${games.length} Unique Games</span>
                        </div>
                        <div class="space-y-1 text-xs">
                            ${games.map(g => `
                                <div class="flex justify-between items-center bg-slate-900 px-2 py-1 rounded">
                                    <span class="${g.location === 'Home' ? 'text-emerald-400 font-semibold' : 'text-sky-400'}">${g.location === 'Home' ? 'vs' : '@'}${g.opponent}</span>
                                    <span class="text-slate-500 text-[10px]">Pot ${g.pot}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterSchedules() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const cards = document.querySelectorAll('.team-card');
            cards.forEach(card => {
                const teamName = card.getAttribute('data-team');
                card.style.display = teamName.includes(query) ? 'block' : 'none';
            });
        }

        displayPots();
    </script>
</body>
</html>
